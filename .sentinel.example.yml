# Sentinel configuration — copy to .sentinel.yml in your repo and tweak.

model:
  provider: ollama        # 'ollama' (free/local, default) or 'openai' (any OpenAI-compatible API)
  model: qwen2.5-coder:7b # any model you have pulled locally (ollama pull qwen2.5-coder:7b)
  base_url: http://localhost:11434
  # For OpenAI-compatible servers (vLLM, LM Studio, TGI, OpenAI itself):
  # provider: openai
  # base_url: http://localhost:8000/v1
  # api_key: ${OPENAI_API_KEY}   # or set OPENAI_API_KEY env var
  temperature: 0.1

thresholds:
  max_severity_posted: info    # findings at/above this severity are posted/reported
  min_severity_autofix: high   # auto-fix only from this severity up

auto_fix:
  enabled: false               # set true to allow `sentinel fix --target pr`
  max_severity: high
  require_tests: true

ignore_paths:
  # - "tests/*"
  # - "*.generated.py"
  # - "vendor/*"

memory_enabled: true
memory_dir: .sentinel-memory